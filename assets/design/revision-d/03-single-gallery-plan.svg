<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1570" viewBox="0 0 2000 1570"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b86442"/></marker><pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M-3 12L12 -3M9 15L15 9" stroke="#c5d9d4" stroke-width="1"/></pattern></defs><rect x="0" y="0" width="2000" height="1570" fill="#f7f5ef" stroke="none" stroke-width="1"/><text x="65" y="65" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >STILL / BUILDING STUDY / REVISION D</text><text x="65" y="127" font-family="Malgun Gothic,Arial,sans-serif" font-size="43" fill="#293c34" >작품이 주인공이 되는, 전시실 한 칸의 구성</text><text x="65" y="173" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" >전시실 02의 확대 평면도 · 치수와 관람 동선을 함께 검토 · 46 px / m</text><path d="M65 204L1935 204" fill="none" stroke="#78877d" stroke-width="1" /><rect x="242" y="395" width="736" height="690" fill="#52645a" stroke="none" stroke-width="1"/><rect x="269.59999999999997" y="422.59999999999997" width="680.8000000000001" height="634.8000000000001" fill="#ece9df" stroke="none" stroke-width="1"/><rect x="536.4" y="1056.48" width="147.20000000000002" height="29.44" fill="#e7d6b8" stroke="none" stroke-width="1"/><rect x="269.59999999999997" y="905.6" width="680.8000000000001" height="151.79999999999998" fill="#e7d6b866" stroke="none" stroke-width="1"/><rect x="495" y="898.7" width="230" height="13.799999999999999" fill="#52645a" stroke="none" stroke-width="1"/><rect x="472" y="464" width="276" height="73.60000000000001" fill="#d8ccba" stroke="none" stroke-width="1"/><rect x="506.5" y="497.35" width="207" height="6.8999999999999995" fill="#b86442" stroke="none" stroke-width="1"/><rect x="472" y="565.2" width="276" height="92" fill="none" stroke="#668b98" stroke-width="2"/><text x="610" y="620.4" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" text-anchor="middle">상부 채광창 6 × 2m</text><rect x="504.2" y="813.6" width="211.6" height="59.800000000000004" fill="#dce8de" stroke="#668b98" stroke-width="1"/><text x="610" y="845.8" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" text-anchor="middle">주 관람 위치</text><polyline points="610,1140.2 610,970 784.8,970 784.8,845.8 610,845.8" fill="none" stroke="#b86442" stroke-width="3"  marker-end="url(#arrow)"/><path d="M610 1140.2L610 912.5" fill="none" stroke="#b5544d" stroke-width="2" stroke-dasharray="6 6"/><path d="M598.5 896.6L621.5 914.6" fill="none" stroke="#b5544d" stroke-width="3" /><path d="M598.5 914.6L621.5 896.6" fill="none" stroke="#b5544d" stroke-width="3" /><path d="M610 809L506.5 500.79999999999995" fill="none" stroke="#668b98" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M610 809L713.5 500.79999999999995" fill="none" stroke="#668b98" stroke-width="1.5" stroke-dasharray="5 5"/><path d="M242 360L978 360" fill="none" stroke="#78877d" stroke-width="1" /><path d="M237 354L247 366" fill="none" stroke="#78877d" stroke-width="1" /><path d="M973 354L983 366" fill="none" stroke="#78877d" stroke-width="1" /><text x="620" y="348" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" >16.0m 외곽 / 14.8m 유효 폭</text><path d="M207 395L207 1085" fill="none" stroke="#78877d" stroke-width="1" /><path d="M202 389L212 401" fill="none" stroke="#78877d" stroke-width="1" /><path d="M202 1079L212 1091" fill="none" stroke="#78877d" stroke-width="1" /><text x="217" y="728" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" >15.0m / 내부 13.8m</text><path d="M876.8 500.79999999999995L876.8 845.8" fill="none" stroke="#78877d" stroke-width="1" /><path d="M871.8 494.79999999999995L881.8 506.79999999999995" fill="none" stroke="#78877d" stroke-width="1" /><path d="M871.8 839.8L881.8 851.8" fill="none" stroke="#78877d" stroke-width="1" /><text x="886.8" y="661.3" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" >7.5m 관람 거리</text><path d="M536.4 1120L683.6 1120" fill="none" stroke="#78877d" stroke-width="1" /><path d="M531.4 1114L541.4 1126" fill="none" stroke="#78877d" stroke-width="1" /><path d="M678.6 1114L688.6 1126" fill="none" stroke="#78877d" stroke-width="1" /><text x="620" y="1108" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" >입구 3.2m</text><text x="610" y="477.79999999999995" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" text-anchor="middle">독립 작품 1점</text><text x="610" y="947" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" text-anchor="middle">시선 가림벽 · 높이 4.2m</text><text x="311" y="1034.4" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >낮은 전실</text><text x="610" y="1181.6" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" text-anchor="middle">연결 회랑에서 진입</text><text x="1180" y="309" font-family="Malgun Gothic,Arial,sans-serif" font-size="32" fill="#293c34" >전시실 설계 기준</text><text x="1180" y="365" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#293c34" >내부 14.8 × 13.8m / 천장 높이 12m</text><text x="1180" y="408" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" >불투명 벽 0.6m / 작품실끼리 시선 차단</text><text x="1180" y="475" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#293c34" >①  입구에서는 작품이 바로 보이지 않음</text><text x="1210" y="518" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >폭 3.2m, 높이 3.6m의 깊은 입구.</text><text x="1210" y="558" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >가림벽이 직접 시선을 막습니다.</text><text x="1180" y="625" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#293c34" >②  가림벽 옆을 지나 큰 공간으로 진입</text><text x="1210" y="668" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >4.2m 전실 천장 → 12m 전시실 천장.</text><text x="1210" y="708" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >높이와 폭이 한 번에 열리도록 구성.</text><text x="1180" y="775" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#293c34" >③  작품 하나를 정면으로 관람</text><text x="1210" y="818" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >주 관람 거리 7.5m, 옆 작품의 간섭 없음.</text><text x="1210" y="858" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >벽면 장식·다른 작품·전경 소품은 배제.</text><text x="1180" y="925" font-family="Malgun Gothic,Arial,sans-serif" font-size="24" fill="#293c34" >④  작품 앞쪽 위에서 내려오는 빛</text><text x="1210" y="968" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >6 × 2m의 개별 확산 채광창.</text><text x="1210" y="1008" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >작품 색이 흐려지지 않는 밝기로 계획.</text><text x="125" y="1310" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#293c34" >입구와 가림벽의 높이를 달리하여, 회랑에서 다른 전시실의 작품이 겹쳐 보이지 않도록 합니다.</text><text x="125" y="1360" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" >8개 실 모두 동일한 원칙을 적용하고, 코너 전시실은 입구를 측면으로 옮겨 연결합니다.</text><text x="125" y="1430" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >이 도면은 건물 구성 검토용입니다. 기존 사이트·카메라·모델에는 적용하지 않았습니다.</text><path d="M65 1488L1935 1488" fill="none" stroke="#78877d" stroke-width="1" /><text x="65" y="1527" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >가상 전시관의 공간 설계안 · 단위 m · 수치는 제안값 · 시공용 구조 도면 아님</text><text x="1570" y="1527" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >D–03 / DESIGN ONLY</text></svg>