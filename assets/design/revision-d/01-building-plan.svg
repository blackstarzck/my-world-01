1260 1445L1560 1445" fill="none" stroke="#78877d" stroke-width="1" /><path d="M1255 1439L1265 1451" fill="none" stroke="#78877d" stroke-width="1" /><path d="M1555 1439L1565 1451" fill="none" stroke="#78877d" stroke-width="1" /><text x="1420" y="1433" font-family="Malgun Gothic,Arial,sans-serif" font-size="19" fill="#293c34" >15m</text><text x="65" y="295" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" fill="#293c34" >01  한 방에 한 작품</text><text x="65" y="342" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >8개의 완전히 분리된 전시실.</text><text x="65" y="380" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >각 실에는 주인공이 하나뿐입니다.</text><text x="65" y="451" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" fill="#293c34" >02  작품을 위한 빈 공간</text><text x="65" y="498" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >전시실마다 약 14~15m의 폭,</text><text x="65" y="536" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >12m 높이와 긴 관람 거리를 확보.</text><text x="65" y="607" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" fill="#293c34" >03  순환하는 회랑</text><text x="65" y="654" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >중앙 중정 둘레의 4m 폭 회랑이</text><text x="65" y="692" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >8개 전시실을 연결합니다.</text><text x="65" y="763" font-family="Malgun Gothic,Arial,sans-serif" font-size="27" fill="#293c34" >04  시선이 겹치지 않는 입구</text><text x="65" y="810" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >낮은 전실과 가림벽을 지나야</text><text x="65" y="848" font-family="Malgun Gothic,Arial,sans-serif" font-size="21" fill="#293c34" >작품이 처음 드러납니다.</text><rect x="65" y="969" width="27" height="27" fill="#b86442" stroke="none" stroke-width="1"/><text x="108" y="991" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >독립된 작품 1점</text><rect x="65" y="1023" width="27" height="27" fill="#e7d6b8" stroke="none" stroke-width="1"/><text x="108" y="1045" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >연결 회랑과 진입 공간</text><rect x="65" y="1077" width="27" height="27" fill="#dce8de" stroke="none" stroke-width="1"/><text x="108" y="1099" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >중정·외곽 빛 우물</text><rect x="65" y="1131" width="27" height="27" fill="#52645a" stroke="none" stroke-width="1"/><text x="108" y="1153" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >두께 0.6m의 불투명 벽</text><text x="1650" y="318" font-family="Malgun Gothic,Arial,sans-serif" font-size="25" fill="#293c34" >도면 읽기</text><text x="1650" y="368" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >주황색 선 1개 = 작품 1개</text><text x="1650" y="409" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >실내에 다른 작품·소품 없음</text><text x="1650" y="480" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >갈색 화살표 = 연결 동선</text><text x="1650" y="521" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >격리된 실 사이를 순환</text><text x="1650" y="592" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >하늘색 해치 = 빛 우물</text><text x="1650" y="633" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >시선을 옆 전시실로 열지 않음</text><text x="1650" y="736" font-family="Malgun Gothic,Arial,sans-serif" font-size="23" fill="#293c34" >B–B 단면 위치</text><path d="M1020 295L1020 1435" fill="none" stroke="#668b98" stroke-width="1.5" stroke-dasharray="12 7"/><text x="1032" y="287" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >B</text><text x="1032" y="1457" font-family="Malgun Gothic,Arial,sans-serif" font-size="20" fill="#293c34" >B</text><text x="1650" y="787" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >전시실 02 → 회랑 → 중정</text><text x="1650" y="824" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >→ 회랑 → 전시실 06</text><text x="1650" y="932" font-family="Malgun Gothic,Arial,sans-serif" font-size="22" fill="#293c34" >전체 외곽 54 × 54m</text><text x="1650" y="974" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >실내 치수는 벽 두께 제외</text><text x="1650" y="1011" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >기존 26 × 20m 공간과 별개인</text><text x="1650" y="1048" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >새 건물 구성 제안</text><path d="M65 1598L1935 1598" fill="none" stroke="#78877d" stroke-width="1" /><text x="65" y="1637" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >가상 전시관의 공간 설계안 · 단위 m · 수치는 제안값 · 시공용 구조 도면 아님</text><text x="1570" y="1637" font-family="Malgun Gothic,Arial,sans-serif" font-size="18" fill="#293c34" >D–01 / DESIGN ONLY</text></svg>