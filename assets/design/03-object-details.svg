<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#f5f3ec"/><text x="70" y="85" font-family="Arial, sans-serif" font-size="18" fill="#303a37" >STILL / DESIGN DOCUMENTS</text><text x="70" y="143" font-family="Arial, sans-serif" font-size="38" fill="#303a37" >Small details make the room real.</text><text x="70" y="180" font-family="Arial, sans-serif" font-size="17" fill="#303a37" >Canvas assembly, support profiles and prop dimensions.</text><line x1="70" y1="206" x2="1530" y2="206" stroke="#7c8279" stroke-width="1" /><rect x="160" y="300" width="282" height="372" fill="#dedcd0" stroke="#303a37"/><rect x="178" y="318" width="246" height="336" fill="#c3704d" stroke="#303a37"/><line x1="160" y1="285" x2="442" y2="285" stroke="#7c8279" stroke-width="1" /><line x1="155" y1="280" x2="165" y2="290" stroke="#7c8279" stroke-width="1" /><line x1="437" y1="280" x2="447" y2="290" stroke="#7c8279" stroke-width="1" /><text x="308" y="275" font-family="Arial, sans-serif" font-size="15" fill="#303a37" >2.35 m</text><line x1="470" y1="300" x2="470" y2="672" stroke="#7c8279" stroke-width="1" /><line x1="465" y1="295" x2="475" y2="305" stroke="#7c8279" stroke-width="1" /><line x1="465" y1="667" x2="475" y2="677" stroke="#7c8279" stroke-width="1" /><text x="477" y="476" font-family="Arial, sans-serif" font-size="15" fill="#303a37" >3.10 m</text><text x="160" y="735" font-family="Arial, sans-serif" font-size="18" fill="#303a37" >BACK ROW / 55 mm canvas depth</text><rect x="600" y="310" width="12" height="362" fill="#dedcd0" stroke="#303a37"/><line x1="606" y1="672" x2="606" y2="710" stroke="#303a37" stroke-width="8" /><rect x="565" y="710" width="85" height="12" fill="#303a37" stroke="#303a37"/><text x="565" y="770" font-family="Arial, sans-serif" font-size="18" fill="#303a37" >SIDE / fixed metal base</text><rect x="880" y="430" width="230" height="60" fill="#acb6a5" stroke="#303a37"/><rect x="896" y="490" width="14" height="85" fill="#9b9a8d" stroke="#303a37"/><rect x="1080" y="490" width="14" height="85" fill="#9b9a8d" stroke="#303a37"/><text x="880" y="620" font-family="Arial, sans-serif" font-size="16" fill="#303a37" >BENCH / 2.0 x 0.55 x 0.48 m</text><rect x="1200" y="430" width="115" height="140" fill="#ddd9c9" stroke="#303a37"/><text x="1160" y="620" font-family="Arial, sans-serif" font-size="16" fill="#303a37" >PLINTH / 0.7 x 0.7 x 0.85 m</text><text x="160" y="840" font-family="Arial, sans-serif" font-size="21" fill="#303a37" >Detail standard: bevels on visible edges, no coplanar overlaps, contact at floor.</text><text x="160" y="882" font-family="Arial, sans-serif" font-size="19" fill="#303a37" >Separate artwork surface / original ratio preserved / no artwork baked into architecture.</text><line x1="70" y1="1015" x2="1530" y2="1015" stroke="#7c8279" stroke-width="1" /><text x="70" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#303a37" >01. GALLERY / 26 x 20 x 10.5 m / Revision C</text><text x="1190" y="1052" font-family="Arial, sans-serif" font-size="14" fill="#303a37" >COORDINATED DESIGN</text></svg>